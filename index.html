<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IX PORTFOLIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', Helvetica, Arial, sans-serif;
        background-color: white;
      }
      /* Custom utility for text justification */
      .text-justify-last-left {
        text-align: justify;
        text-align-last: left;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      #error-display {
        display: none;
        padding: 20px;
        color: red;
        font-family: monospace;
        font-size: 12px;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(255,255,255,0.9);
        border-top: 1px solid red;
        z-index: 9999;
      }
      /* Force left alignment for work detail page - Override all centering */
      article {
        text-align: left !important;
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      article > div {
        text-align: left !important;
        display: block !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      /* Force left alignment for work detail images */
      .work-detail-image-container {
        text-align: left !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        float: none !important;
        clear: both !important;
      }
      /* Hide scrollbar for image strip */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .work-detail-image {
        display: block !important;
        margin: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding: 0 !important;
        float: none !important;
      }
      /* Ensure all sections are left aligned */
      section {
        text-align: left !important;
        display: block !important;
        width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
      }
      /* Override any flex centering */
      #root > div {
        display: block !important;
        width: 100% !important;
      }
    </style>
</head>
  <body>
    <div id="root" class="min-h-screen flex items-center justify-center">
      <div class="animate-pulse text-sm font-bold tracking-widest uppercase">Loading Portfolio...</div>
    </div>
    
    <div id="error-display"></div>

    <script>
      // Global error handler to catch loading issues
      window.onerror = function(message, source, lineno, colno, error) {
        const el = document.getElementById('error-display');
        if (el) {
          el.style.display = 'block';
          el.innerHTML = '<strong>Error:</strong> ' + message + '<br>Source: ' + source;
        }
      };
    </script>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.1",
    "react/jsx-runtime": "https://esm.sh/react@19.2.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.2.1",
    "react-dom/client": "https://esm.sh/react-dom@19.2.1/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@19.2.1,react-dom@19.2.1",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@19.2.1,react-dom@19.2.1"
  }
}
</script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
